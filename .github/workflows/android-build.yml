name: android-build

# 仓库已转公共（Actions 免费不占额度），保持手动触发、按需构建。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # M0：把首次生成的 Cargo.lock 提交回仓库，保证后续构建可复现
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（含 aarch64-linux-android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agate-server

      # 内核单元测试必须由 CI 真跑一遍。
      #
      # 为什么单独一步、而且放在 NDK 之前：交叉编译只证明「能编过」，
      # 而这里的千余条单测覆盖的是**行为契约**（站点身份与主机一一对应、
      # 注册表里每家都在 implemented_kinds 里、账号 id 前缀不撞、行尾/编码
      # 之外的接线点……）。2026-11 本地首次执行时就跑出过 8 个失败、其中 3 个
      # 是真实缺陷；若只在本地跑，回归就靠人记得。
      #
      # 放前面还有一个实际原因：NDK 安装 + `cargo install cargo-ndk` 要花几分钟，
      # 单测失败应该在那之前就停下来。
      - name: 内核单元测试（cargo test --lib）
        working-directory: agate-server
        run: cargo test --lib

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 NDK r27c 与 cargo-ndk
        run: |
          command -v sdkmanager >/dev/null || export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: 交叉编译 libagate_server.so（O5 验证点：rustls/ring + rusqlite bundled）
        run: bash scripts/build-android-so.sh

      - name: 提交 Cargo.lock
        run: |
          cd agate-server
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: lock agate-server dependencies [skip ci]"
            git push
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 数据层单元测试（SSE 报文解析）
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 构建 M0 Demo APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 上传产物（APK + .so）
        uses: actions/upload-artifact@v4
        with:
          name: agate-m0-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            core-gateway/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 7
