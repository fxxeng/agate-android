name: android-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agate-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux host runs portable Rust library unit tests only. This is not a
  # Linux/Desktop product build; the Android target build below is authoritative.
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agate-server
      # R48: 全库已 cargo fmt 收敛，格式门从「可见不阻断」转为阻断。
      - name: Rust formatting
        run: cargo fmt --manifest-path agate-server/Cargo.toml --all -- --check
      - name: Portable Rust check (lib + bins)
        run: cargo check --manifest-path agate-server/Cargo.toml --locked --lib --bins
      # R46/T1（A 案）：panic 纪律门——生产 lib 禁 unwrap/expect/panic 类构造。
      # release 是 panic=abort，任何 panic = 整个 App 进程死亡（UI/FGS/调度器
      # 全带走）；纪律 + 机械门禁是「禁止 panic 穿越 JNI」在 abort 语义下的
      # 可执行形式。存量不变量背板已逐条白名单（各处 allow 注释 + R46 T1
      # 裁定表）。只对 --lib 生效，测试代码豁免。
      - name: Panic discipline gate (clippy)
        run: cargo clippy --manifest-path agate-server/Cargo.toml --locked --lib -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
      - name: Portable Rust tests (lib + bins)
        run: cargo test --manifest-path agate-server/Cargo.toml --locked --lib --bins

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (Android arm64 + x86_64)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agate-server
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # CI-Fix9: cache the Gradle wrapper and dependency caches across runs
      # (previously every run re-downloaded the distribution and all deps).
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install Android NDK r27c and cargo-ndk
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          # 钉版本：浮动 latest 会让 CI 因 cargo-ndk 自身升级而突然变红。
          cargo install cargo-ndk --version 4.1.2 --locked
      # R47/T3.1：Android target clippy（六 lint 与宿主 rust-tests 门同口径）。
      # jni_bridge 与全部 cfg(target_os="android") 代码此前只被 cargo-ndk build
      # 编译过、从未被 clippy 照过（R46 盲区声明），此处收口。只跑 aarch64：
      # x86_64 编译的是同一份 android 代码，覆盖面相同、时间减半。置于 NDK
      # 安装后、.so 构建前，失败早停。
      # 经 cargo-ndk 包一层与 .so 构建步完全同环境：依赖树含 ring/libsqlite3-sys，
      # 其 build script 的 cc 探测需要目标编译器（裸 clippy 在 5s 内瞬败
      # exit 101——run #277 首跑实证；check 不链接，但 build script 照跑）。
      - name: Android target clippy (panic discipline gate)
        run: |
          cd agate-server
          cargo ndk -t arm64-v8a clippy --locked --lib --target aarch64-linux-android -- \
            -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic \
            -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
      # CI-Fix9: build both ABIs in ONE cargo invocation (shared dependency
      # compilation). APK ABI purity is guaranteed by ndk.abiFilters in
      # app/build.gradle.kts, not by build order, so having the x86_64 .so
      # in jniLibs early is safe.
      - name: Build Rust Android libraries (arm64-v8a + x86_64)
        run: bash scripts/build-android-so.sh arm64-v8a x86_64
      - name: Verify JNI exports against Kotlin declarations
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 scripts/verify-jni-exports.py \
            --kotlin core-gateway/src/main/java/dev/agate/core/Gateway.kt \
            --library core-gateway/src/main/jniLibs/arm64-v8a/libagate_server.so \
            --nm "$NDK_BIN/llvm-nm" \
            --rust agate-server/src/jni_bridge.rs
      # CI-Fix9: single Gradle invocation for tests + both APKs (reuses one
      # configuration phase and one JVM instead of two cold starts).
      - name: Gradle tests and APK builds
        run: >-
          ./gradlew :app:testDebugUnitTest :core-gateway:testDebugUnitTest
          :app:assembleDebug :app:assembleRelease --no-daemon
      # T4: --apksigner enables the signature section — debug APKs must carry
      # the shared debug keystore fingerprint; unsigned release passes until
      # release signing is configured (see README Signing).
      - name: Verify APK contents, native ELF architecture and signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          python3 scripts/verify-android-apks.py \
            --apksigner "$APKSIGNER" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agate-android-apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14
      # CI-Fix10: keep full unit-test reports so red runs come with real stack traces.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: |
            core-gateway/build/reports/tests/
            core-gateway/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # x86_64 .so is already built in the single dual-ABI Rust step above.
      - name: Android Instrumentation (x86_64 emulator)
        uses: reactivecircus/android-emulator-runner@4f4106d3fcce05df782f55421d7a769a2d2e0713 # v2.8.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1200
          # Keep the emulator diagnostics even when Gradle/instrumentation fails.
          # `set +e` is intentional: the EXIT trap must run after a non-zero test result.
          script: bash .github/scripts/run-instrumentation.sh
      - name: Upload Android Instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agate-android-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/agate-instrumentation-diagnostics/**
          if-no-files-found: warn
          retention-days: 14
