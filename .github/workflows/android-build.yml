name: android-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agate-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agate-server
      # Repository-wide rustfmt debt predates this branch (413 files in the
      # first CI audit). Keep the check visible but non-blocking while a
      # dedicated formatting-only change is planned; compile/tests remain gates.
      - name: Rust formatting (legacy debt; non-blocking)
        continue-on-error: true
        run: cargo fmt --manifest-path agate-server/Cargo.toml --all -- --check
      - name: Rust all-targets check
        run: cargo check --manifest-path agate-server/Cargo.toml --locked --all-targets
      - name: Rust all-targets tests
        run: cargo test --manifest-path agate-server/Cargo.toml --locked --all-targets

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (Android arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agate-server
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK r27c and cargo-ndk
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: bash scripts/build-android-so.sh arm64-v8a
      - name: Verify JNI exports against Kotlin declarations
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 scripts/verify-jni-exports.py \
            --kotlin core-gateway/src/main/java/dev/agate/core/Gateway.kt \
            --library core-gateway/src/main/jniLibs/arm64-v8a/libagate_server.so \
            --nm "$NDK_BIN/llvm-nm"
      - name: Gradle tests
        run: ./gradlew :app:testDebugUnitTest :core-gateway:testDebugUnitTest --no-daemon
      - name: Build Debug and Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Verify APK contents and native ELF architecture
        run: |
          python3 scripts/verify-android-apks.py \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: agate-android-apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14
      # x86_64 仅用于 GitHub Android Emulator 的真实 JNI/Service Instrumentation。
      # 正式 Debug/Release APK 已在上面按默认 arm64-v8a 构建并校验，不受此步骤影响。
      - name: Build Rust Android library for x86_64 instrumentation
        run: bash scripts/build-android-so.sh x86_64
      - name: Android Instrumentation (x86_64 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PagateInstrumentationAbi=x86_64 --no-daemon
      - name: Upload Android Instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agate-android-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
