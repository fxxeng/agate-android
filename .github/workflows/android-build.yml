name: android-build

# 仓库已转公共（Actions 免费不占额度），保持手动触发、按需构建。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # M0：把首次生成的 Cargo.lock 提交回仓库，保证后续构建可复现
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（含 aarch64-linux-android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent2api-server

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 NDK r27c 与 cargo-ndk
        run: |
          command -v sdkmanager >/dev/null || export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: 交叉编译 libagate_server.so（O5 验证点：rustls/ring + rusqlite bundled）
        run: bash scripts/build-android-so.sh

      - name: 提交 Cargo.lock
        run: |
          cd agent2api-server
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: lock agent2api-server dependencies [skip ci]"
            git push
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 M0 Demo APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 上传产物（APK + .so）
        uses: actions/upload-artifact@v4
        with:
          name: agate-m0-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            core-gateway/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
