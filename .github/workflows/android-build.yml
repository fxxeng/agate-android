name: android-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agate-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agate-server
      # Repository-wide rustfmt debt predates this branch (413 files in the
      # first CI audit). Keep the check visible but non-blocking while a
      # dedicated formatting-only change is planned; compile/tests remain gates.
      - name: Rust formatting (legacy debt; non-blocking)
        continue-on-error: true
        run: cargo fmt --manifest-path agate-server/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --manifest-path agate-server/Cargo.toml --locked --lib

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (Android arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agate-server
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK r27c and cargo-ndk
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: bash scripts/build-android-so.sh arm64-v8a
      - name: Gradle tests
        run: ./gradlew :app:testDebugUnitTest :core-gateway:testDebugUnitTest --no-daemon
      - name: Build Debug and Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Verify APK contents
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libagate_server.so'
          done
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: agate-android-apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14
