name: android-build

# 仓库已转公共（Actions 免费不占额度），保持手动触发、按需构建。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # M0：把首次生成的 Cargo.lock 提交回仓库，保证后续构建可复现
      contents: write

    steps:
      - uses: actions/checkout@v4
        # 行尾体检要能读 `HEAD^`，默认的浅克隆只有 1 个提交。
        with:
          fetch-depth: 2

      # 判官自己的单测：体检脚本的 `classify()` 判错两个方向都有代价
      # （假阳性让人关掉检查，假阴性让事故溜过去）。历史上第一版就漏了
      # 「改内容 + 换行尾」这种最常见形状，所以判据本身要有回归保护。
      - name: 行尾判据单测
        run: python3 tools/test_check_eol.py

      # 行尾体检：拦住「只是行尾变了、内容一字未改」的整文件 churn。
      #
      # 本仓有 34 个历史 CRLF 文件（`.gitattributes` 已给它们标 `-text`，git 不
      # 再碰它们的行尾）。但只要有那么一次工具用错（脚本按 LF 重写了整个文件），
      # 提交里就会出现 1461/1461 那种 diff —— 而**本地编译与测试全绿**，
      # 只有在 `git diff --numstat` 里才看得见。2026-11 已经踩过三次。
      #
      # 判据是精确的：普通 diff 非空、且 `--ignore-cr-at-eol` 之后该文件的改动
      # 归零（或只剩不到一半）⇒ 行尾噪音占了主导。见 `tools/check_eol.py` 模块头。
      - name: 行尾体检（整文件 churn）
        run: python3 tools/check_eol.py --commit HEAD

      - name: Rust 工具链（含 aarch64-linux-android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agate-server

      # 内核单元测试必须由 CI 真跑一遍。
      #
      # 为什么单独一步、而且放在 NDK 之前：交叉编译只证明「能编过」，
      # 而这里的千余条单测覆盖的是**行为契约**（站点身份与主机一一对应、
      # 注册表里每家都在 implemented_kinds 里、账号 id 前缀不撞、行尾/编码
      # 之外的接线点……）。2026-11 本地首次执行时就跑出过 8 个失败、其中 3 个
      # 是真实缺陷；若只在本地跑，回归就靠人记得。
      #
      # 放前面还有一个实际原因：NDK 安装 + `cargo install cargo-ndk` 要花几分钟，
      # 单测失败应该在那之前就停下来。
      - name: 内核单元测试（cargo test --lib）
        working-directory: agate-server
        run: cargo test --lib

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 NDK r27c 与 cargo-ndk
        run: |
          command -v sdkmanager >/dev/null || export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: 交叉编译 libagate_server.so（O5 验证点：rustls/ring + rusqlite bundled）
        run: bash scripts/build-android-so.sh

      - name: 提交 Cargo.lock
        run: |
          cd agate-server
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: lock agate-server dependencies [skip ci]"
            git push
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 数据层单元测试（SSE 报文解析）
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 构建 M0 Demo APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 上传产物（APK + .so）
        uses: actions/upload-artifact@v4
        with:
          name: agate-m0-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            core-gateway/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 7
